<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayi Girişi | Gensa Frigo</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
            --color-brand-600: #265259;
            --color-brand-950: #0a181a;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200 shadow-xl">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-50 rounded-2xl text-brand-600 mb-4">
                <i data-lucide="lock" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900">Bayi Girişi</h2>
            <p class="text-sm text-slate-500 mt-2">Sisteme giriş yapmak için bilgilerinizi giriniz.</p>
        </div>
        
        <form class="space-y-5" onsubmit="event.preventDefault(); alert('Sistem entegrasyonu sonrası aktif edilecektir.');">
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Bayi ID</label>
                <input type="text" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none transition-all text-sm" placeholder="Bayi Numaranız">
            </div>
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Şifre</label>
                <input type="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none transition-all text-sm" placeholder="••••••••">
            </div>
            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded text-brand-600">
                    <span class="text-slate-600">Beni Hatırla</span>
                </label>
                <a href="#" class="font-bold text-brand-600 hover:text-brand-700">Şifremi Unuttum</a>
            </div>
            <button type="submit" class="w-full py-4 bg-brand-950 hover:bg-brand-600 text-white rounded-xl text-sm font-bold uppercase tracking-wider transition-all">Giriş Yap</button>
            <a href="index.html" class="block text-center text-xs text-slate-400 hover:text-slate-600">Ana Sayfaya Dön</a>
        </form>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
